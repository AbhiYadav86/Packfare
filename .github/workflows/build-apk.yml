name: Build Packfare APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add API keys (from repository secrets, if set)
        env:
          TP_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TP_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            [ -n "$TP_TOKEN" ] && echo "travelpayouts.token=$TP_TOKEN"
            [ -n "$TP_MARKER" ] && echo "travelpayouts.marker=$TP_MARKER"
          } > local.properties
          true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -n 200 || true
          grep -E "^e: file://" build.log | head -n 40 | while read -r line; do
            f=$(echo "$line" | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)#\1#')
            l=$(echo "$line" | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)#\2#')
            m=$(echo "$line" | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)#\4#')
            echo "::error file=$f,line=$l::$m"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Packfare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK releases (permanent version + "latest")
        if: success() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.9.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "Packfare-v${VERSION}.apk"
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):')
          # 1) A permanent, numbered release for this exact build (never overwritten)
          gh release create "v${VERSION}" "Packfare-v${VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Packfare v${VERSION}" \
            --notes "${NOTES}" || true
          # 2) The moving "latest" download link
          cp "Packfare-v${VERSION}.apk" Packfare.apk
          gh release delete packfare-latest --yes --cleanup-tag || true
          gh release create packfare-latest Packfare.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Packfare (latest build) — v${VERSION}" \
            --notes "Always the newest build from main. Older versions are listed on the Releases page as v0.9.x."
